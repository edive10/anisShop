<div class="row">
  <div class="col-xs-12">
    <!-- تصویر با گوشه‌های گرد و سایه ملایم -->
    <img [src]="recipe.imagePath" alt="{{recipe.name}}" class="img-responsive img-thumbnail book-img">
  </div>
</div>

<div class="row">
  <div class="col-xs-12">
    <h1 class="book-title">{{ recipe.name }}</h1>
  </div>
</div>

<div class="row">
  <div class="col-xs-12">
    <div class="btn-group" appDropdown>
      <button type="button" class="btn btn-primary" (click)="onAddToCart()" style="cursor:pointer"> افزودن به سبد
      </button>
    </div>

  </div>
</div>

<div class="row" style="margin-top: 20px;">
  <div class="col-xs-12 book-description">
    {{recipe.description}}
  </div>
</div>

<div class="row" style="margin-top: 20px;">
  <div class="col-xs-12">
    <ul class="list-group">
      <!-- استفاده از کلاس custom-list برای استایل‌دهی -->
      <li class="list-group-item custom-list-item" *ngFor="let ingredient of recipe.ingredients">
        <span class="ingredient-name">{{ingredient.name}}</span> :
        <span class="ingredient-amount">{{ ingredient.amount }}</span>
      </li>
    </ul>
  </div>
</div>
<p class="book-price">
  قیمت: {{ recipe.price | number }} تومان
</p>
<div class="row">
  <div class="col-xs-12">
    <button class="btn btn-primary dropdown-toggle btn-lg" (click)="toggleImages()">تصاویر داخل کتاب</button>
  </div>
</div>
<div class="row">
  <div class="col-xs-12">
  </div>
</div>

<div class="row" *ngIf="showImages">

  <div class="col-sm-4 col-xs-6" *ngFor="let img of recipe.images; let i = index">

    <div class="gallery-card">
      <img [src]="img" class="gallery-img" loading="lazy" (click)="openImage(img,i)">
    </div>

  </div>

</div>
<div class="image-modal" *ngIf="showModal">
  <div class="modal-backdrop" (click)="closeModal()"></div>

  <div class="modal-content" (click)="$event.stopPropagation()">
    <span class="close-btn" (click)="closeModal()">×</span>

    <button class="nav-btn left" (click)="prevImage()">❮</button>

    <img [src]="selectedImage" class="modal-img" alt="book image">

    <button class="nav-btn right" (click)="nextImage()">❯</button>
  </div>
</div>
<div class="reviews-section">
  <h3>نظرات کاربران</h3>

  <!-- نمایش لیست نظرات -->
  <div class="review-list">
    <div *ngFor="let r of recipe.reviews" class="review-item">
      <div class="review-header">
        <strong>{{ r.username }}</strong>
        <span class="stars">{{ "⭐".repeat(r.rating) }}</span>
      </div>
      <p>{{ r.comment }}</p>
      <small>{{ r.date | date:'yyyy/MM/dd' }}</small>
    </div>
  </div>

  <hr>

  <!-- فرم ثبت نظر جدید -->
  <div class="add-review">
    <h4>ثبت نظر جدید</h4>
    <div class="form-group">
      <input type="text" #nameInput class="form-control" placeholder="نام شما">
    </div>
    <div class="form-group">
      <select #ratingInput class="form-control">
        <option value="5">۵ ستاره (عالی)</option>
        <option value="4">۴ ستاره</option>
        <option value="3">۳ ستاره</option>
        <option value="2">۲ ستاره</option>
        <option value="1">۱ ستاره</option>
      </select>
    </div>
    <div class="form-group">
      <textarea #commentInput class="form-control" rows="3" placeholder="متن نظر..."></textarea>
    </div>
    <button class="btn btn-primary" (click)="onAddReview(nameInput, ratingInput, commentInput)">ثبت نظر</button>
  </div>
</div>
