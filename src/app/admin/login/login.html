<div class="login-wrapper">

  <div class="login-card">

    <h2>Admin Panel</h2>
    <p class="subtitle">Sign in to continue</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <input
          type="email"
          placeholder="Email"
          [(ngModel)]="email"
          name="email"
          required
        >
      </div>

      <div class="form-group">
        <input
          type="password"
          placeholder="Password"
          [(ngModel)]="password"
          name="password"
          required
        >
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <p *ngIf="error" class="error">
      {{ error }}
    </p>

  </div>

</div>
