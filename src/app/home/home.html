<div class="home-container">

  <!-- HERO SLIDER -->
  <section class="hero-slider">
    <div class="hero-content">
      <h1>فروشگاه تخصصی کتاب‌های دانشگاهی</h1>
      <p>جدیدترین و معتبرترین منابع علمی</p>
      <a routerLink="/recipes" class="btn btn-warning btn-lg">
        ورود به فروشگاه
      </a>
    </div>
  </section>


  <!-- FEATURED BOOKS -->
  <section class="featured-section container">

    <div class="text-center">
      <h2 class="section-title">پرفروش‌ترین کتاب‌ها</h2>
    </div>

    <div class="row">

      <div class="col-md-4" *ngFor="let book of books">

        <div class="book-card">

          <div class="book-img">
            <img [src]="book.image" alt="book">
          </div>

          <div class="book-info">
            <h4>{{ book.title }}</h4>
            <p class="price">
              {{ book.price | number }} تومان
            </p>

            <button class="btn btn-success btn-block" (click)="addToCart(book)">
              افزودن به سبد خرید
            </button>
          </div>

        </div>

      </div>

    </div>

  </section>

  <section class="newest-section">
    <div class="container-fluid">
      <h2 class="section-title">جدیدترین کتاب‌ها</h2>

      <!-- کانتینر اصلی اسنپ اسکرول -->
      <div class="snap-scroll-wrapper">
        <div class="book-snap-card" *ngFor="let book of newBooks">
          <div class="badge-new">جدید</div>
          <img [src]="book.image" [alt]="book.title">
          <div class="card-body">
            <h5>{{ book.title }}</h5>
            <p class="price">{{ book.price | number }} تومان</p>
            <button (click)="addToCart(book)" class="btn-buy">
              افزودن به سبد
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <h2>بیش از 500 عنوان کتاب تخصصی</h2>
    <a routerLink="/recipes" class="btn btn-warning btn-lg">
      مشاهده همه کتاب‌ها
    </a>
  </section>

</div>
