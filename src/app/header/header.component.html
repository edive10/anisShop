<!-- =============================================
     ۱. هدر مخصوص کاربران عادی (وقتی ادمین نیست)
     ============================================= -->
<nav *ngIf="!isAdmin" class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container-fluid">
    <!-- لوگو و برند -->
    <a class="navbar-brand fw-bold" routerLink="/">
      📚 انتشارات مهرپاینده
    </a>

    <!-- دکمه موبایل -->
    <button type="button" class="navbar-toggler" (click)="isMenuCollapsed = !isMenuCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLinkActive="active" routerLink="/books">کتاب‌ها</a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center" (click)="openCart()" style="cursor: pointer;">
            <i class="bi bi-cart me-1"></i>
            سبد خرید
            <span *ngIf="cartCount > 0" class="badge rounded-pill bg-danger ms-2">
              {{ cartCount }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- =============================================
     ۲. هدر مخصوص پنل مدیریت (وقتی ادمین است)
     ============================================= -->
<nav *ngIf="isAdmin" class="navbar navbar-dark bg-dark admin-top-nav shadow">
  <div class="container-fluid">
    <div class="d-flex align-items-center">
      <span class="navbar-brand mb-0 h1 fs-6">
        <i class="bi bi-speedometer2 me-2"></i>
        میز کار مدیریت
      </span>
    </div>
    
    <div class="d-flex align-items-center gap-3">
      <span class="text-light small d-none d-md-inline">خوش آمدید، مدیر سیستم</span>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i> خروج
      </button>
    </div>
  </div>
</nav>
