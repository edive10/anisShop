<div class="add-book-container">
  <h2>Add New Book</h2>

  <form (ngSubmit)="onSubmit()" #bookForm="ngForm">
    
    <div class="form-group">
      <label for="name">Book Name</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="book.name"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="author">Author</label>
      <input
        type="text"
        id="author"
        name="author"
        [(ngModel)]="book.author"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="book.description"
        required
        class="form-control"
        rows="4"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input
        type="number"
        id="price"
        name="price"
        [(ngModel)]="book.price"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="image">Image URL</label>
      <input
        type="text"
        id="image"
        name="image"
        [(ngModel)]="book.image"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input
        type="text"
        id="category"
        name="category"
        [(ngModel)]="book.category"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="stock">Stock</label>
      <input
        type="number"
        id="stock"
        name="stock"
        [(ngModel)]="book.stock"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="pages">Pages</label>
      <input
        type="number"
        id="pages"
        name="pages"
        [(ngModel)]="book.pages"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="language">Language</label>
      <input
        type="text"
        id="language"
        name="language"
        [(ngModel)]="book.language"
        required
        class="form-control"
      />
    </div>

    <button type="submit" class="btn btn-primary">Add Book</button>
  </form>

  <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
